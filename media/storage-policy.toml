# Storage acceptance lanes. Prefer the highest-ranked lane whose controller is
# actually implemented by the target; never substitute a newer driver for a
# different PCI device.

[[lane]]
name = "piix-eide"
rank = 1
driver = "EIDE"
driver_project = "drvEIDE-16.2"
pci_ids = ["8086:1230", "8086:7010", "8086:7111"]
hdd = "IDE primary master"
cdrom = "ATAPI secondary master"
qemu = "piix3-ide"
whitebox = "AM-BX133 internal PIIX4E"
status = "active"

