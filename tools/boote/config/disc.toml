name = "boote-openstep-patch4-disc"
description = "OPENSTEP Patch 4 kernel and installer UFS carried on the BootE CD"

[strings]
OPTIMIZATION_LEVEL = "-Oz"
EMBEDED_THEME = "embed"
OPENSTEP_DRIVERS = "EISABus PCIBus Intel824X0 PS2Keyboard PS2Mouse EIDE BusLogicSCSIDriver Adaptec2940SCSIDriver VBE20DisplayDriver MatroxMGA2064WDisplayDriver"
OPENSTEP_KERNEL_FLAGS = "rootdev=cdrom"
OPENSTEP_SYSTEM_TABLE = "/private/Drivers/i386/System.config/Instance0.table"
OPENSTEP_EIDE_TABLE = "Dual_EIDE"

[booleans]
BDMESG = false
FDISK440 = false
OPENUP = false
BOOT0_DEBUG = false
BOOT0_VERBOSE = true
BOOT1_HFS = false
BOOT1_HFS_DEBUG = false
BOOT1_HFS_VERBOSE = false
BOOT1_HFS_ACTIVE = false
BOOT1_HFS_ACTIVE_DEBUG = false
BOOT1_HFS_ACTIVE_VERBOSE = false
MODULES = false
MODULE_DEBUG = false
EMBED_THEME = false
KLIBC_MODULE = false
UCLIBCXX_MODULE = false
RESOLUTION_MODULE = false
HELLOWORLD_MODULE = false
KEYLAYOUT_MODULE = false
SATA_MODULE = false
ACPICODEC_MODULE = false
KERNELPATCHER_MODULE = false
OPENSTEP_HANDOFF = true
OPENSTEP_SARLD = true
OPENSTEP_VBE = false
OPENSTEP_EIDE_SAFE = true
OPENSTEP_EIDE_PRIMARY_ONLY = true
OPENSTEP_ATAPI_SLAVE = true
OPENSTEP_AMD_ALIAS = false
