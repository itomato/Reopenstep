name = "boote-cubx-real-mode-entry-probe"
description = "CUBX diagnostic that marks VGA and halts at BootE's first instruction"

[strings]
OPTIMIZATION_LEVEL = "-Oz"
EMBEDED_THEME = "embed"
OPENSTEP_DRIVERS = "EISABus PCIBus Intel824X0 PS2Keyboard EIDE BusLogicSCSIDriver Adaptec2940SCSIDriver VBE20DisplayDriver MatroxMGA2064WDisplayDriver"
OPENSTEP_KERNEL_FLAGS = "rootdev=hd0a"

[booleans]
BDMESG = false
FDISK440 = false
OPENUP = false
BOOT0_DEBUG = false
BOOT0_VERBOSE = true
BOOT1_HFS = false
BOOT1_HFS_DEBUG = false
BOOT1_HFS_VERBOSE = false
BOOT1_HFS_ACTIVE = false
BOOT1_HFS_ACTIVE_DEBUG = false
BOOT1_HFS_ACTIVE_VERBOSE = false
MODULES = false
MODULE_DEBUG = false
EMBED_THEME = false
KLIBC_MODULE = false
UCLIBCXX_MODULE = false
RESOLUTION_MODULE = false
HELLOWORLD_MODULE = false
KEYLAYOUT_MODULE = false
SATA_MODULE = false
ACPICODEC_MODULE = false
KERNELPATCHER_MODULE = false
OPENSTEP_HANDOFF = true
OPENSTEP_SARLD = true
OPENSTEP_VBE = false
OPENSTEP_EIDE_SAFE = true
OPENSTEP_ENTRY_PROBE = true
