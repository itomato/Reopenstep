name = "boote-openstep-patch4-buslogic-scsi"
description = "OPENSTEP Patch 4 BootE using PCI BusLogic SCSI"

[strings]
OPENSTEP_DRIVERS = "EISABus PCIBus BusLogicSCSIDriver VBE20DisplayDriver"
OPENSTEP_KERNEL_FLAGS = "rootdev=cdrom"
OPENSTEP_SYSTEM_TABLE = "/private/Drivers/i386/System.config/Instance0.table"

[booleans]
OPENSTEP_HANDOFF = true
OPENSTEP_SARLD = true
OPENSTEP_VBE = true
